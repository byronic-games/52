<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#120b1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="52! Daily">
  <title>52! Daily</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="images/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="daily.css?v=20260619a">
</head>
<body class="daily-page">
  <main class="daily-shell">
    <section class="daily-card">
      <header class="daily-hero">
        <div>
          <p class="eyebrow">Shared Daily Run</p>
          <h1>52! Daily</h1>
        </div>
        <p class="lead">Same seed, powers, and cheat offers for everyone.</p>
      </header>

      <section class="daily-summary">
        <div class="summary-block">
          <div class="summary-label">Daily Date</div>
          <div class="daily-nav-wrapper">
            <button id="daily-nav-prev" class="daily-nav-btn daily-nav-prev" type="button" aria-label="Previous daily">«</button>
            <div class="summary-value" id="daily-date-label">-</div>
            <button id="daily-nav-next" class="daily-nav-btn daily-nav-next" type="button" aria-label="Next daily">»</button>
          </div>
        </div>
      </section>

      <section class="daily-variant-panel" aria-label="Daily run type">
        <div class="daily-variant-toggle" role="tablist" aria-label="Daily leaderboard type">
          <button id="daily-variant-normal" class="daily-variant-btn active" type="button" data-variant="normal" role="tab" aria-selected="true">
            <span>Normal</span>
            <small>Classic Daily</small>
          </button>
          <button id="daily-variant-hard" class="daily-variant-btn" type="button" data-variant="hard" role="tab" aria-selected="false">
            <span>Hard</span>
            <small>No tear hints</small>
          </button>
        </div>
        <p id="daily-variant-note" class="daily-status daily-variant-note"></p>
      </section>

      <section class="daily-player">
        <label class="field-label" for="daily-name-input">Player Name</label>
        <input id="daily-name-input" type="text" maxlength="24" autocomplete="name" placeholder="Your name">
        <p id="daily-status" class="daily-status"></p>
      </section>

      <section class="daily-result" id="daily-result-panel">
        <div class="summary-block summary-highlight">
          <div class="daily-result-row">
            <div class="daily-result-copy">
              <div class="summary-label">Cards Cleared</div>
              <div class="summary-value" id="daily-score-label">-</div>
              <div class="daily-score-meta" id="daily-score-meta"></div>
            </div>
            <div class="daily-rank-pill" id="daily-rank-label" hidden></div>
            <button id="daily-share-btn" class="daily-share-btn" type="button">Share</button>
          </div>
        </div>
      </section>

      <div class="daily-actions">
        <button id="daily-start-btn" class="btn btn-primary" type="button">Play Daily</button>
        <button id="daily-close-btn" class="btn btn-secondary" type="button">Close</button>
      </div>

      <section class="daily-board">
        <div class="section-bar">
          <div class="section-title">Daily Leaderboard</div>
          <div class="section-chip" id="daily-board-count">0 entries</div>
        </div>
        <p id="daily-board-status" class="daily-status daily-board-status">Connecting to online leaderboard...</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th id="daily-score-heading">Cards</th>
              </tr>
            </thead>
            <tbody id="daily-table-body">
              <tr><td colspan="3">Loading daily board...</td></tr>
            </tbody>
          </table>
        </div>
        <div id="daily-entry-popover" class="daily-entry-popover hidden" aria-hidden="true"></div>
      </section>
    </section>
  </main>

  <script src="js/fullscreen.js?v=20260425b"></script>
  <script src="js/constants.js?v=20260512z"></script>
  <script src="js/leaderboard.js?v=20260612b"></script>
  <script src="js/daily.js?v=20260629c"></script>
  <script src="js/daily-page.js?v=20260707c"></script>
  <script src="js/pwa-update.js?v=20260522p"></script>
</body>
</html>
