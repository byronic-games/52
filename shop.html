<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#120b1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>52! Shop</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="images/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="shop.css?v=20260525c">
</head>
<body class="shop-page">
  <main class="shop-shell">
    <section class="shop-card" aria-labelledby="shop-title">
      <header class="shop-header">
        <p class="shop-kicker">Cosmetic Unlocks</p>
        <h1 id="shop-title">Card Back Shop</h1>
        <div class="shop-balance" aria-live="polite">
          <span>Experience</span>
          <strong id="shop-experience-value">0</strong>
        </div>
      </header>

      <section class="shop-carousel" aria-label="Card back cosmetics">
        <button class="shop-arrow" id="shop-prev-btn" type="button" aria-label="Previous card back">‹</button>
        <article class="shop-cosmetic">
          <div class="shop-card-preview-wrap">
            <div id="shop-card-preview" class="shop-card-preview card-back card-back-blue"></div>
          </div>
          <div class="shop-cosmetic-copy">
            <h2 id="shop-cosmetic-name">Classic</h2>
            <p id="shop-cosmetic-desc">The standard 52! patterned back.</p>
            <p id="shop-cosmetic-cost" class="shop-cost">Owned</p>
          </div>
        </article>
        <button class="shop-arrow" id="shop-next-btn" type="button" aria-label="Next card back">›</button>
      </section>

      <div class="shop-dots" id="shop-dots" aria-hidden="true"></div>

      <div class="shop-actions">
        <button class="shop-primary-btn" id="shop-action-btn" type="button">Select</button>
        <a class="shop-secondary-btn" href="index.html">Close</a>
      </div>

      <p class="shop-note" id="shop-note" aria-live="polite">Card backs keep the run colour outline. Faces stay unchanged.</p>
    </section>
  </main>

  <script src="js/fullscreen.js?v=20260506b"></script>
  <script src="js/constants.js?v=20260521c"></script>
  <script src="js/storage.js?v=20260521c"></script>
  <script src="js/cosmetics.js?v=20260521c"></script>
  <script src="js/shop.js?v=20260525c"></script>
  <script src="js/pwa-update.js?v=20260522p"></script>
</body>
</html>
