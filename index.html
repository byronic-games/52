<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#141218">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="52!">
  <title>52!</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="images/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app-shell.css?v=20260713d">
</head>
<body>
  <div id="app-root" class="app-shell">
    <header class="app-topbar">
      <button id="top-home-btn" class="app-mark" type="button" aria-label="Home">52!</button>
      <div id="top-crowns" class="top-crowns" aria-label="Collected crowns" hidden></div>
      <div class="app-xp" aria-live="polite"><span id="top-experience-value">0</span><span>XP</span></div>
      <div class="app-top-actions">
        <button id="top-shop-btn" class="icon-btn" type="button" aria-label="Shop">
          <svg class="sf-icon" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
            <path d="M4.5 6.25h2.7l2.1 10.35a2.2 2.2 0 0 0 2.16 1.77h8.42a2.2 2.2 0 0 0 2.08-1.5l2-6.08H8.14" />
            <path d="M11.35 22.15h.05M20.75 22.15h.05" />
            <circle cx="11.38" cy="22.15" r="1.05" />
            <circle cx="20.78" cy="22.15" r="1.05" />
          </svg>
        </button>
        <button id="top-profile-btn" class="icon-btn" type="button" aria-label="Profile">
          <svg class="sf-icon" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
            <circle cx="14" cy="14" r="10.25" />
            <circle cx="14" cy="10.8" r="3.15" />
            <path d="M7.4 21.55c1.1-3.1 3.42-4.78 6.6-4.78s5.5 1.68 6.6 4.78" />
          </svg>
        </button>
        <div class="app-menu-wrap">
          <button id="top-menu-btn" class="icon-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="shell-menu"><span class="hamburger-glyph" aria-hidden="true">☰</span></button>
          <div id="shell-menu" class="shell-menu hidden" aria-hidden="true">
            <button class="shell-menu-action" id="menu-help-btn" type="button">How To Play</button>
            <button class="shell-menu-action" id="menu-scores-btn" type="button">High Scores</button>
            <button class="shell-menu-action" id="menu-settings-btn" type="button">Settings</button>
            <button class="shell-menu-action shell-menu-exit" id="menu-exit-btn" type="button" hidden>End Run</button>
          </div>
        </div>
      </div>
    </header>

    <div id="shell-menu-backdrop" class="shell-menu-backdrop" aria-hidden="true"></div>

    <main class="app-views">
      <section class="app-view home-view" data-view="home" aria-hidden="false">
        <div class="home-logo">
          <img src="images/52logo.png" alt="52!" width="1222" height="1222">
        </div>
        <div class="home-actions">
          <button id="home-play-btn" class="tile-btn play" type="button">
            <span class="tile-symbol">♠</span>
            <span class="tile-title">Play</span>
          </button>
          <button id="home-daily-btn" class="tile-btn daily" type="button">
            <span class="tile-symbol">♦</span>
            <span class="tile-title">Daily</span>
          </button>
          <button id="home-collection-btn" class="tile-btn collection" type="button">
            <span class="tile-symbol">★</span>
            <span class="tile-title">Collection</span>
          </button>
        </div>
      </section>

      <section class="app-view panel-view setup-view" data-view="setup" aria-hidden="true">
        <div id="setup-body" class="panel-body"></div>
      </section>

      <section class="app-view play-view" data-view="play" aria-hidden="true">
        <div id="app-play-host"></div>
      </section>

      <section class="app-view panel-view" data-view="daily" aria-hidden="true">
        <header class="panel-head daily-head">
          <span class="panel-head-spacer" aria-hidden="true"></span>
          <div class="segment-row daily-top-tabs" id="daily-variant-tabs"></div>
          <span class="panel-head-spacer" aria-hidden="true"></span>
        </header>
        <div id="daily-body" class="panel-body"></div>
      </section>

      <section class="app-view panel-view collection-view" data-view="collection" aria-hidden="true">
        <div id="collection-body" class="panel-body collection-layout"></div>
      </section>

      <section class="app-view panel-view" data-view="shop" aria-hidden="true">
        <header class="panel-head">
          <span class="panel-head-spacer" aria-hidden="true"></span>
          <h1 class="panel-title">Shop</h1>
          <span class="panel-head-spacer" aria-hidden="true"></span>
        </header>
        <div id="shop-body" class="panel-body shop-layout"></div>
      </section>

      <section class="app-view panel-view" data-view="profile" aria-hidden="true">
        <header class="panel-head">
          <span class="panel-head-spacer" aria-hidden="true"></span>
          <h1 class="panel-title">Profile</h1>
          <span class="panel-head-spacer" aria-hidden="true"></span>
        </header>
        <div id="profile-body" class="panel-body"></div>
      </section>

      <section class="app-view panel-view" data-view="settings" aria-hidden="true">
        <header class="panel-head">
          <span class="panel-head-spacer" aria-hidden="true"></span>
          <h1 class="panel-title">Settings</h1>
          <span class="panel-head-spacer" aria-hidden="true"></span>
        </header>
        <div id="settings-body" class="panel-body"></div>
      </section>

      <section class="app-view panel-view" data-view="deck" aria-hidden="true">
        <header class="panel-head">
          <span class="panel-head-spacer" aria-hidden="true"></span>
          <h1 class="panel-title">Deck</h1>
          <span class="panel-head-spacer" aria-hidden="true"></span>
        </header>
        <div id="deck-body" class="panel-body"></div>
      </section>

      <section class="app-view panel-view" data-view="help" aria-hidden="true">
        <header class="panel-head">
          <span class="panel-head-spacer" aria-hidden="true"></span>
          <h1 class="panel-title">Help</h1>
          <span class="panel-head-spacer" aria-hidden="true"></span>
        </header>
        <div id="help-body" class="panel-body"></div>
      </section>
    </main>

    <div id="shell-modal" class="shell-modal hidden" aria-hidden="true">
      <div id="shell-modal-backdrop" class="shell-modal-backdrop"></div>
      <article class="shell-dialog" role="dialog" aria-modal="true" aria-labelledby="shell-modal-title">
        <button id="shell-modal-close" class="shell-close-btn" type="button" aria-label="Close">×</button>
        <h2 id="shell-modal-title" class="shell-modal-title"></h2>
        <div id="shell-modal-body" class="shell-modal-body"></div>
      </article>
    </div>
  </div>

  <script src="js/fullscreen.js?v=20260709bk"></script>
  <script src="js/constants.js?v=20260713c"></script>
  <script src="js/storage.js?v=20260713c"></script>
  <script src="js/cosmetics.js?v=20260709bk"></script>
  <script src="js/powers.js?v=20260709bk"></script>
  <script src="js/cheats.js?v=20260713c"></script>
  <script src="js/cheat-balance-overrides.js?v=20260713c"></script>
  <script src="js/apply-cheat-balance-overrides.js?v=20260713c"></script>
  <script src="js/leaderboard.js?v=20260709bk"></script>
  <script src="js/daily.js?v=20260709bk"></script>
  <script src="js/item-stats.js?v=20260709bk"></script>
  <script src="js/app-strings.js?v=20260709bk"></script>
  <script src="js/app-shell.js?v=20260713f"></script>
  <script src="js/pwa-update.js?v=20260709bk"></script>
</body>
</html>
